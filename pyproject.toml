[project]
name = "pytorch4cv"
version = "0.1.0"
description = "Guía práctica de PyTorch para Visión por Computador: teoría, ejercicios estilo examen y soluciones."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Enrique Rodríguez Camacho" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy",
    "matplotlib",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pre-commit"]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = ["slow: tests que tardan más de unos segundos"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP006", "UP035", "B905"]

[tool.ruff.lint.per-file-ignores]
# Al quitar la solución quedan imports/variables sin usar: es lo esperado en un enunciado.
"exercises/**" = ["F401", "F841", "B008"]
# `p: Percentage = Percentage(0.5)` es la firma literal del examen extraordinario.
"solutions/cv/05_explainability/perturbation.py" = ["B008"]

[tool.mypy]
ignore_missing_imports = true

# Torch sin CUDA (más ligero). Borra este bloque si quieres usar GPU con uv.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
