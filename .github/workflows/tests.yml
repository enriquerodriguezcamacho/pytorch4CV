name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Instalar dependencias
        run: pip install numpy matplotlib pillow tqdm pytest ruff
      - name: Ejercicios sincronizados con las soluciones
        run: python tools/make_exercises.py --check
      - name: Ruff
        run: ruff check .
      - name: Tests (soluciones)
        run: python -m pytest --target solutions
